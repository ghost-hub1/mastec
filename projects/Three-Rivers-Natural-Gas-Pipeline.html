    <script>
      $(".banner-title-texture").fitText();
      $("#power-generation").fitText(0.98);
      if (document.documentMode || /Edge/.test(navigator.userAgent)) {
        $(".texture-bg").addClass("no-background");
      }
      function checkScroll() {
        if ($(window).scrollTop() >= 80) {
          $("#header").addClass("fixed");
        } else {
          $("#header").removeClass("fixed");
        }
      }

      $("#infrastructure-projects").fitText(0.48);
      $("#connect").fitText(0.47);
      $("#why-mastec").fitText(0.695);
      $("#invest").fitText(0.33);
      $("#whoweare").fitText(0.63);
      $("#news").fitText(0.71);
      $("#join-the-team").fitText(0.73);
      $(".proven-experience-link").click(function () {
        $("html, body").animate(
          {
            scrollTop: $(".scrolldown").offset().top - 155,
          },
          1000,
        );
        return false;
      });
      if (document.documentMode || /Edge/.test(navigator.userAgent)) {
        $(".texture-bg").addClass("no-background");
      }
      $(".proven-experience").slick({
        dots: false,
        arrows: true,
        infinite: true,
        speed: 500,
        slidesToShow: 1,
        slidesToScroll: 1,
      });

      $(document).ready(function () {
        checkScroll();
        $(window).scroll(checkScroll);
      });
    </script>
    <script type="text/javascript">
      $(document).ready(function () {
        $(".our-process-slide").slick({
          dots: false,
          arrows: false,
          infinite: false,
          speed: 300,
          slidesToShow: 4,
          slidesToScroll: 1,
        });
        $('a[data-toggle="tab"]').on("shown.bs.tab", function (e) {
          $(".slick-track li").removeClass("active");
          $(this).parents("li").addClass("active");
        });
      });
      $(".slick-bullet").click(function (e) {
        var tid = $(this).data("id");
        $(".nav-tabs li:eq(" + tid + ") a").tab("show");
        $(".nav-tabs li:eq(" + tid + ")").addClass("active");
        $(".slick-bullet").removeClass("active");
        $(this).addClass("active");
      });
    </script>
    <script type="text/javascript">
      $(document).ready(function () {
        $(".next-prev").slick({
          nextArrow: $(".next"),
          prevArrow: $(".prev"),
          autoplay: true,

          lidesToScroll: 1,
          autoplaySpeed: 9000,
        });

      $(".explore-projects").click(function () {

      $(".learn-about").click(function () {

      $(".current-openings-btn").click(function () {

      $(".project-detail-slider").slick({

        slidesToScroll: 1,

      $("#directivTvForm").click(function () {
        $("#directTv").show();
        $("#generalInquiry").hide();
      });
      $("#generalEnquiryForm").click(function () {
        $("#directTv").hide();
        $("#generalInquiry").show();
      });

      $(".featured-project-slider").slick({
        infinite: true,
        dots: true,
        slidesToShow: 1,
        slidesToScroll: 1,
        adaptiveHeight: true,
      });

      // MAKE ENTIRE AREA CLICKABLE
      $(".clickablearea").click(function () {
        if ($(this).find("a").attr("rel") == "external") {
          window.open($(this).find("a").attr("href"));
        }
        if ($(this).find("a").attr("target") == "_blank") {
          window.open($(this).find("a").attr("href"));
        } else {
          window.location = $(this).find("a").attr("href");
          return false;
        }
        return;
      });

      // EXTERNAL WINDOWS
      $('a[rel="external"]').click(function () {
        window.open($(this).attr("href"));
        return false;
      });

      $("#services-provided-accordion a[href*=\\#]").click(function () {
        this.scrollIntoView({
          behavior: "smooth",
          block: "start",
          inline: "end",
        });
      });

      $(document).ready(function () {
        if ($("body").hasClass("expertise-landing")) {
          $("#header").addClass("fixed");
          $("#header").addClass("fixed-always");
        }

        if ($("body").hasClass("project-detail")) {
          $("#header").addClass("fixed");
          $("#header").addClass("fixed-always");
        }

        $(".form-toggles .btn").click(function () {
          $(".form-toggles").find(".btn").removeClass("active");
          if ($(this).hasClass("active")) {
            $(this).removeClass("active");
          } else {
            $(this).addClass("active");
          }
        });

        $(".expertise-service .panel-group .panel a").click(function () {
          if ($(this).hasClass("active")) {
            $(this).removeClass("active");
            $(this).find("i").removeClass("fa-chevron-up");
            $(this).find("i").addClass("fa-chevron-down");
          } else {
            $(".expertise-service .panel-group")
              .find("a")
              .removeClass("active");
            $(".expertise-service .panel-group a")
              .find("i")
              .removeClass("fa-chevron-up");
            $(".expertise-service .panel-group a")
              .find("i")
              .addClass("fa-chevron-down");
            $(this).addClass("active");
            $(this).find("i").removeClass("fa-chevron-down");
            $(this).find("i").addClass("fa-chevron-up");
          }
        });
      });
    </script>
